<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do List</h1>
        <ul class="todo-list" id="todoList"></ul>
        <div class="add-todo">
            <input type="text" id="todoInput" placeholder="Add a new task...">
            <button onclick="addTodo()">Add</button>
        </div>
        <button onclick="clearCompleted()" style="margin-top: 10px; padding: 10px 20px; background: #ff6b6b; color: white; border: none; border-radius: 5px; cursor: pointer;">Clear Completed</button>
    </div>

    <script src="script.js"></script>
    <script>
        const app = new TodoApp();

        function renderTodos() {
            const todoList = document.getElementById('todoList');
            todoList.innerHTML = '';
            app.tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'todo-item';
                li.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTodo(${index})">
                    <span style="text-decoration: ${task.completed ? 'line-through' : 'none'}">${task.text}</span>
                    <button onclick="deleteTodo(${index})" style="background: #ff6b6b; color: white; border: none; border-radius: 3px; padding: 5px 10px; cursor: pointer;">Delete</button>
                `;
                todoList.appendChild(li);
            });
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            if (input.value.trim()) {
                app.addTask(input.value);
                input.value = '';
                renderTodos();
            }
        }

        function deleteTodo(index) {
            app.deleteTask(index);
            renderTodos();
        }

        function toggleTodo(index) {
            app.toggleComplete(index);
            renderTodos();
        }

        function clearCompleted() {
            app.clearCompleted();
            renderTodos();
        }

        // Initial render
        renderTodos();
    </script>
</body>
</html>
